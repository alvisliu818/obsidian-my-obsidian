# Yarn 4 Plug'n'Play（2026-10 迁移，替代 npm + node_modules）
nodeLinker: pnp

# 包 cache 落全局目录（不进公开仓），随 globalFolder 一起放在 E 盘
enableGlobalCache: true
globalFolder: E:/HOME/Code/.yarn-global

# unplugged（需真实文件的包：codemirror 系列、jieba-wasm、wa-sqlite、
# web-tree-sitter、vscode-oniguruma、basedpyright 等）同样落全局——
# 解压目录多项目共享，省去每项目 ~207MB 重复解压（zip 缓存没有可硬链接的
# 文件，unplugged 必须解压；全局化后每项目边际成本≈0）。
pnpUnpluggedFolder: E:/HOME/Code/.yarn-global/unplugged

# 允许 node-pty 等带构建脚本的包执行 install 脚本（默认 true，显式声明）
enableScripts: true

# obsidian-calendar-ui@0.3.12 的嵌套依赖 obsidian-daily-notes-interface@0.8.4
# 硬声明 obsidian: github:obsidianmd/obsidian-api#master（npm 时代锁 9abd9605
# 同为该 API）。packageExtensions 只加不替换，所以这里直接放行 git 源。
approvedGitRepositories:
  - "*github.com/obsidianmd/obsidian-api*"

