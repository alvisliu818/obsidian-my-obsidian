<svg viewBox="0 0 680 490" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>目标架构：思源式常驻内核</title>
<desc>常驻 kernel 进程通过 HTTP 与 SSE 服务多客户端，带单实例复用与发现文件，移动端降级内嵌</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<text x="340" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">目标 · 思源式常驻内核</text>
<rect x="40" y="64" width="170" height="254" rx="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="125" y="88" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">客户端（瘦）</text>
<rect x="56" y="104" width="138" height="40" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="125" y="124" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" fill="#0C447C">Obsidian 主窗</text>
<rect x="56" y="152" width="138" height="40" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="125" y="172" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" fill="#0C447C">popout 窗口</text>
<rect x="56" y="200" width="138" height="40" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="125" y="220" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" fill="#0C447C">外部脚本 / CLI</text>
<rect x="56" y="248" width="138" height="40" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="125" y="268" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">浏览器前端（可选）</text>
<rect x="270" y="64" width="240" height="330" rx="20" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="390" y="88" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#085041">常驻 kernel 进程</text>
<text x="390" y="106" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">detached · 单实例锁 · 空闲自退</text>
<rect x="286" y="120" width="208" height="40" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="390" y="140" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#085041">KernelApi v2 · op 分发</text>
<rect x="286" y="170" width="208" height="40" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="390" y="190" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" fill="#085041">HTTP /api/:op + SSE 推送</text>
<rect x="286" y="222" width="100" height="34" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="336" y="239" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">BlockIndex</text>
<rect x="394" y="222" width="100" height="34" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="444" y="239" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">FTS 检索</text>
<rect x="286" y="264" width="100" height="34" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="336" y="281" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">ext 域扫描</text>
<rect x="394" y="264" width="100" height="34" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="444" y="281" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">文本抽取</text>
<ellipse cx="390" cy="336" rx="66" ry="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<rect x="324" y="336" width="132" height="40" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<rect x="324" y="336" width="132" height="10" fill="#F1EFE8" stroke="none"/>
<ellipse cx="390" cy="376" rx="66" ry="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="390" y="360" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">SQLite 单写者</text>
<rect x="270" y="406" width="240" height="34" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="390" y="423" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">discovery：port + token + pid</text>
<rect x="540" y="64" width="100" height="210" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="590" y="88" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#712B13">移动端</text>
<rect x="550" y="104" width="80" height="52" rx="8" fill="#FFFFFF" stroke="#F0997B" stroke-width="0.5"/>
<text x="590" y="122" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">kernel 不可达</text>
<text x="590" y="140" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">无 child_process</text>
<rect x="550" y="168" width="80" height="52" rx="8" fill="#FFFFFF" stroke="#F0997B" stroke-width="0.5"/>
<text x="590" y="186" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">in-renderer 降级</text>
<text x="590" y="204" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">wa-sqlite 预留位</text>
<line x1="512" y1="170" x2="536" y2="170" stroke="#993C1D" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow)"/>
<line x1="212" y1="190" x2="266" y2="190" stroke="#0F6E56" stroke-width="1.5" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="240" y="176" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">HTTP 请求</text>
<text x="240" y="206" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">← SSE 事件</text>
<text x="340" y="458" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">Obsidian 退出不 kill：重开秒连，索引已热；discovery 探活 → 复用已有内核</text>
<text x="340" y="476" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">同合同三后端：daemon（桌面）/ in-renderer（降级）/ CLI 一次性</text>
</svg>
