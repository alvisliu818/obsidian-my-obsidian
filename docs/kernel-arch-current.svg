<svg viewBox="0 0 680 456" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>现状架构：stdio 子进程隔离</title>
<desc>Obsidian 渲染进程通过 stdio JSON 行协议与 index-daemon 子进程通信，daemon 独占 SQLite 索引库</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<text x="340" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">现状 · 档位 2：stdio 子进程隔离</text>
<rect x="40" y="56" width="300" height="310" rx="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="190" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">Obsidian 渲染进程（Electron）</text>
<rect x="62" y="98" width="256" height="40" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="190" y="118" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" fill="#0C447C">main.ts · vault 事件转发</text>
<rect x="62" y="146" width="256" height="40" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="190" y="166" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" fill="#0C447C">unified-search（FTS 搜索）</text>
<rect x="62" y="194" width="256" height="40" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="190" y="214" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" fill="#0C447C">logseq 模块（反链/标签/卡片）</text>
<rect x="62" y="242" width="256" height="40" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<text x="190" y="262" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" fill="#0C447C">omnisearch（文件名/标签域）</text>
<rect x="62" y="294" width="256" height="56" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="190" y="314" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">BlockIndexDaemonClient</text>
<text x="190" y="332" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">崩溃退避重启 · 缓存失效</text>
<rect x="420" y="56" width="220" height="200" rx="20" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="530" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#085041">index-daemon.cjs</text>
<text x="530" y="98" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">系统 node 子进程</text>
<rect x="436" y="116" width="188" height="40" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="530" y="136" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" fill="#085041">SqliteIndex 写入管道</text>
<rect x="436" y="166" width="188" height="40" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="530" y="186" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" fill="#085041">FTS / ext 域查询</text>
<ellipse cx="530" cy="296" rx="72" ry="11" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<rect x="458" y="296" width="144" height="50" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<rect x="458" y="296" width="144" height="11" fill="#F1EFE8" stroke="none"/>
<ellipse cx="530" cy="346" rx="72" ry="11" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="530" y="326" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">logseq-index.sqlite</text>
<line x1="344" y1="180" x2="416" y2="180" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="380" y="166" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">stdio JSON 行</text>
<text x="380" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">忙时互塞：ping 秒级延迟</text>
<text x="340" y="396" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">unload → dispose() kill：索引进程随 Obsidian 一起退出</text>
<text x="340" y="416" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">Obsidian 重启 = 全量重连 + 冷启动同步</text>
<text x="340" y="436" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">DB 在磁盘：进程死库不死（可重建投影）</text>
</svg>
