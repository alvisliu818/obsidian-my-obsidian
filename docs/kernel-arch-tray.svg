<svg viewBox="0 0 680 392" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>托盘监护架构</title>
<desc>常驻内核进程持有原生托盘 helper 子进程，托盘菜单的退出动作走内核停机路径，Obsidian 客户端不受影响</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<text x="340" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">托盘：内核持有的原生 helper（R2c）</text>
<rect x="40" y="90" width="150" height="56" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="115" y="110" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#444441">Obsidian 客户端</text>
<text x="115" y="128" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">HTTP/SSE 不变</text>
<rect x="250" y="64" width="192" height="200" rx="20" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="346" y="88" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#085041">常驻 kernel 进程</text>
<text x="346" y="106" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">detached · trayResident</text>
<rect x="266" y="120" width="160" height="40" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="346" y="140" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">SqliteIndex / FTS 管道</text>
<rect x="266" y="172" width="160" height="40" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="346" y="192" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">停机函数：idx.close → exit</text>
<rect x="506" y="90" width="140" height="64" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="576" y="112" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#854F0B">tray helper.exe</text>
<text x="576" y="130" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#BA7517">stdio JSON · ~5MB</text>
<rect x="506" y="196" width="140" height="108" rx="8" fill="#FFFFFF" stroke="#BA7517" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="576" y="216" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">打开 Obsidian</text>
<text x="576" y="236" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">立即同步</text>
<text x="576" y="256" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">全量重建</text>
<line x1="520" y1="270" x2="632" y2="270" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="576" y="288" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="500" fill="#A32D2D">退出内核</text>
<line x1="192" y1="118" x2="246" y2="118" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="219" y="104" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">HTTP/SSE</text>
<line x1="444" y1="122" x2="502" y2="122" stroke="#BA7517" stroke-width="1.5" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="473" y="108" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#BA7517">stdio JSON</text>
<path d="M504 268 L472 268 L472 196 L446 196" fill="none" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="468" y="252" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#A32D2D">退出 → 停机函数</text>
<text x="340" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">helper 崩溃 → 内核无头继续（可选组件，不影响索引）；kernelTray 开启 → 空闲自退关闭</text>
<text x="340" y="350" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">内核退出/换血后，Obsidian 走 discovery 探活自动重连</text>
<text x="340" y="372" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">Electron 托盘壳被否决：Obsidian.exe 内嵌 app.asar，独立运行时 100MB 级</text>
</svg>
